<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img"><title>Voice Completion illustrative reconstruction</title><g font-family="Arial, sans-serif"><rect x="0" y="0" width="1000" height="650" rx="16" fill="#f1f5f1"/><rect x="0" y="0" width="1000" height="58" rx="0" fill="#193f35"/><text x="24" y="36" fill="#fff" font-size="15" font-weight="700">WORKFLOW CONCEPT</text><text x="650" y="36" fill="#c7eab9" font-size="13" font-weight="600">ILLUSTRATIVE UI · FICTIONAL DATA</text><rect x="0" y="58" width="176" height="592" rx="0" fill="#fff"/><text x="22" y="102" fill="#687d73" font-size="12" font-weight="700">NORTHSTAR RETAIL</text><text x="25" y="140" fill="#687d73" font-size="14" font-weight="400">Overview</text><rect x="12" y="164" width="152" height="38" rx="6" fill="#eaf4e9"/><text x="25" y="189" fill="#193f35" font-size="14" font-weight="600">Forms</text><text x="25" y="238" fill="#687d73" font-size="14" font-weight="400">Insights</text><text x="25" y="287" fill="#687d73" font-size="14" font-weight="400">Assistant</text><text x="25" y="336" fill="#687d73" font-size="14" font-weight="400">Evidence review</text><text x="202" y="106" fill="#193f35" font-size="25" font-weight="700">Speak naturally. Review structured responses.</text><text x="202" y="133" fill="#687d73" font-size="13" font-weight="400">Sample workspace / Demonstration only</text><rect x="202" y="157" width="345" height="455" rx="10" fill="#fff" stroke="#dce5df"/><text x="223" y="193" fill="#193f35" font-size="19" font-weight="700">Voice capture</text><rect x="223" y="211" width="204.0" height="28" rx="14" fill="#eaf4e9"/><text x="235" y="230" fill="#193f35" font-size="12" font-weight="600">Tamil · Example language</text><rect x="222" y="262" width="305" height="154" rx="10" fill="#eaf4e9"/><text x="239" y="294" fill="#193f35" font-size="16" font-weight="400">“The entrance is clean.</text><text x="239" y="318" fill="#193f35" font-size="16" font-weight="400">Th