<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img"><title>Forms Workflow illustrative reconstruction</title><g font-family="Arial, sans-serif"><rect x="0" y="0" width="1000" height="650" rx="16" fill="#f1f5f1"/><rect x="0" y="0" width="1000" height="58" rx="0" fill="#193f35"/><text x="24" y="36" fill="#fff" font-size="15" font-weight="700">WORKFLOW CONCEPT</text><text x="650" y="36" fill="#c7eab9" font-size="13" font-weight="600">ILLUSTRATIVE UI · FICTIONAL DATA</text><rect x="0" y="58" width="176" height="592" rx="0" fill="#fff"/><text x="22" y="102" fill="#687d73" font-size="12" font-weight="700">NORTHSTAR RETAIL</text><text x="25" y="140" fill="#687d73" font-size="14" font-weight="400">Overview</text><rect x="12" y="164" width="152" height="38" rx="6" fill="#eaf4e9"/><text x="25" y="189" fill="#193f35" font-size="14" font-weight="600">Forms</text><text x="25" y="238" fill="#687d73" font-size="14" font-weight="400">Insights</text><text x="25" y="287" fill="#687d73" font-size="14" font-weight="400">Assistant</text><text x="25" y="336" fill="#687d73" font-size="14" font-weight="400">Evidence review</text><text x="202" y="106" fill="#193f35" font-size="25" font-weight="700">Configure once. Reuse across locations.</text><text x="202" y="133" fill="#687d73" font-size="13" font-weight="400">Sample workspace / Demonstration only</text><rect x="202" y="155" width="478" height="465" rx="10" fill="#fff" stroke="#dce5df"/><rect x="698" y="155" width="274" height="465" rx="10" fill="#fff" stroke="#dce5df"/><text x="224" y="190" fill="#193f35" font-size="21" font-weight="700">Opening checklist</text><rect x="523" y="170" width="61.5" height="28" rx="14" fill="#eaf4e9"/><text x="535" y="189" fill="#193f35" font-size="12" font-weight="600">Draft</text><text x="224" y="218" fill="#687d73" font-size="14" font-weight="400">Section 1 / Store readiness</text><rect x="222" y="240" width="438" height="95" rx="10" fill="#f5f8f5"/><text x="240" y="268" fill="#193f35" font-size="16" font-weight="600">01  Is the entrance clean?</text><rect x="240" y="285" width="46.5" height="28" rx="14" fill="#eaf4e9"/><text x="252" y="304" fill="#193f35" font-size="12" font-weight="600">Yes</text><rect x="320" y="285" width="39.0" height="28" rx="14" fill="#f8e8df"/><text x="332" y="304" fill="#c55c39" font-size="12" font-weight="600">No</text><rect x="222" y="351" width="438" height="118" rx="10" fill="#f5f8f5"/><text x="240" y="381" fill="#193f35" font-size="16" font-weight="600">02  Add supporting evidence</text><rect x="240" y="397" width="400" height="50" rx="6" fill="#fff" stroke="#dce5df"/><text x="255" y="427" fill="#687d73" font-size="14" font-weight="400">+  Attach a photo or describe the condition</text><rect x="222" y="487" width="438" height="72" rx="10" fill="#eaf4e9"/><text x="240" y="514" fill="#193f35" font-size="14" font-weight="700">Conditional follow-up</text><text x="240" y="540" fill="#193f35" font-size="14" font-weight="400">If “No” → create a corrective task</text><text x="718" y="191" fill="#193f35" font-size="17" font-weight="700">Connected workflow</text><rect x="715" y="238" width="240" height="72" rx="10" fill="#f5f8f5"/><text x="730" y="265" fill="#193f35" font-size="16" font-weight="600">1  Capture</text><text x="730" y="289" fill="#687d73" font-size="13" font-weight="400">Questions and evidence</text><rect x="715" y="333" width="240" height="72" rx="10" fill="#f5f8f5"/><text x="730" y="360" fill="#193f35" font-size="16" font-weight="600">2  Route</text><text x="730" y="384" fill="#687d73" font-size="13" font-weight="400">Assign to location owner</text><rect x="715" y="428" width="240" height="72" rx="10" fill="#f5f8f5"/><text x="730" y="455" fill="#193f35" font-size="16" font-weight="600">3  Resolve</text><text x="730" y="479" fill="#687d73" font-size="13" font-weight="400">Track the corrective task</text><rect x="727" y="545" width="189.0" height="28" rx="14" fill="#eaf4e9"/><text x="739" y="564" fill="#193f35" font-size="12" font-weight="600">Reusable configuration</text></g></svg>