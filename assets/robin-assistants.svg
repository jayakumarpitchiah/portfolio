<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img"><title>Robin Assistants illustrative reconstruction</title><g font-family="Arial, sans-serif"><rect x="0" y="0" width="1000" height="650" rx="16" fill="#f1f5f1"/><rect x="0" y="0" width="1000" height="58" rx="0" fill="#193f35"/><text x="24" y="36" fill="#fff" font-size="15" font-weight="700">WORKFLOW CONCEPT</text><text x="650" y="36" fill="#c7eab9" font-size="13" font-weight="600">ILLUSTRATIVE UI · FICTIONAL DATA</text><rect x="0" y="58" width="176" height="592" rx="0" fill="#fff"/><text x="22" y="102" fill="#687d73" font-size="12" font-weight="700">NORTHSTAR RETAIL</text><text x="25" y="140" fill="#687d73" font-size="14" font-weight="400">Overview</text><text x="25" y="189" fill="#687d73" font-size="14" font-weight="400">Forms</text><text x="25" y="238" fill="#687d73" font-size="14" font-weight="400">Insights</text><rect x="12" y="262" width="152" height="38" rx="6" fill="#eaf4e9"/><text x="25" y="287" fill="#193f35" font-size="14" font-weight="600">Assistant</text><text x="25" y="336" fill="#687d73" font-size="14" font-weight="400">Evidence review</text><text x="202" y="106" fill="#193f35" font-size="25" font-weight="700">Knowledge on the floor. Answers in the office.</text><text x="202" y="133" fill="#687d73" font-size="13" font-weight="400">Sample workspace / Demonstration only</text><rect x="202" y="157" width="350" height="455" rx="10" fill="#fff" stroke="#dce5df"/><text x="224" y="190" fill="#193f35" font-size="16" font-weight="700">Mobile Robin / Frontline staff</text><rect x="220" y="215" width="314" height="78" rx="10" fill="#edf2f8"/><text x="235" y="241" fill="#193f35" font-size="15" font-weight="400">What should I do when an item</text><text x="235" y="265" fill="#193f35" font-size="15" font-weight="400">is unavailable on the shelf?</text><rect x="220" y="311" width="314" height="207" rx="10" fill="#eaf4e9"/><text x="236" y="339" fill="#193f35" font-size="15" font-weight="400">Check the backroom stock record.</text><text x="236" y="363" fill="#193f35" font-size="15" font-weight="400">If unavailable, notify the duty lead</text><text x="236" y="387" fill="#193f35" font-size="15" font-weight="400">and follow the substitute-item</text><text x="236" y="411" fill="#193f35" font-size="15" font-weight="400">guidance for your department.</text><text x="236" y="457" fill="#687d73" font-size="11" font-weight="700">SOURCE</text><text x="236" y="480" fill="#193f35" font-size="13" font-weight="600">Stock availability guide · Section 3</text><rect x="236" y="529" width="76.5" height="28" rx="14" fill="#eaf4e9"/><text x="248" y="548" fill="#193f35" font-size="12" font-weight="600">Helpful</text><rect x="574" y="157" width="398" height="455" rx="10" fill="#fff" stroke="#dce5df"/><text x="595" y="190" fill="#193f35" font-size="16" font-weight="700">Dashboard Robin / Administrator</text><rect x="592" y="215" width="362" height="78" rx="10" fill="#edf2f8"/><text x="607" y="241" fill="#193f35" font-size="15" font-weight="400">Which locations need follow-up</text><text x="607" y="265" fill="#193f35" font-size="15" font-weight="400">on closing-checklist completion?</text><rect x="592" y="311" width="362" height="247" rx="10" fill="#eaf4e9"/><text x="608" y="342" fill="#193f35" font-size="19" font-weight="700">2 locations to review</text><text x="608" y="380" fill="#193f35" font-size="16" font-weight="600">River Walk</text><text x="608" y="405" fill="#687d73" font-size="14" font-weight="400">3 late submissions</text><text x="608" y="450" fill="#193f35" font-size="16" font-weight="600">Harbor Point</text><text x="608" y="475" fill="#687d73" font-size="14" font-weight="400">2 open corrective tasks</text><text x="608" y="532" fill="#687d73" font-size="12" font-weight="400">Sample operational-query response</text></g></svg>