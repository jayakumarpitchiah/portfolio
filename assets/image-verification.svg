<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img"><title>Image Verification illustrative reconstruction</title><g font-family="Arial, sans-serif"><rect x="0" y="0" width="1000" height="650" rx="16" fill="#f1f5f1"/><rect x="0" y="0" width="1000" height="58" rx="0" fill="#193f35"/><text x="24" y="36" fill="#fff" font-size="15" font-weight="700">WORKFLOW CONCEPT</text><text x="650" y="36" fill="#c7eab9" font-size="13" font-weight="600">ILLUSTRATIVE UI · FICTIONAL DATA</text><rect x="0" y="58" width="176" height="592" rx="0" fill="#fff"/><text x="22" y="102" fill="#687d73" font-size="12" font-weight="700">NORTHSTAR RETAIL</text><text x="25" y="140" fill="#687d73" font-size="14" font-weight="400">Overview</text><text x="25" y="189" fill="#687d73" font-size="14" font-weight="400">Forms</text><text x="25" y="238" fill="#687d73" font-size="14" font-weight="400">Insights</text><text x="25" y="287" fill="#687d73" font-size="14" font-weight="400">Assistant</text><rect x="12" y="311" width="152" height="38" rx="6" fill="#eaf4e9"/><text x="25" y="336" fill="#193f35" font-size="14" font-weight="600">Evidence review</text><text x="202" y="106" fill="#193f35" font-size="25" font-weight="700">Verify the evidence. Review uncertainty.</text><text x="202" y="133" fill="#687d73" font-size="13" font-weight="400">Sample workspace / Demonstration only</text><rect x="202" y="156" width="372" height="453" rx="10" fill="#fff" stroke="#dce5df"/><text x="224" y="190" fill="#193f35" font-size="18" font-weight="700">Submitted evidence</text><rect x="222" y="214" width="332" height="209" rx="10" fill="#dbe7de"/><rect x="241" y="260" width="294" height="8" rx="1" fill="#70877a"/><rect x="241" y="325" width="294" height="8" rx="1" fill="#70877a"/><rect x="241" y="390" width="294" height="8" rx="1" fill="#70877a"/><rect x="251" y="230" width="38" height="30" rx="2" fill="#b5c8b9"/><rect x="302" y="239" width="48" height="21" rx="2" fill="#edc9a8"/><rect x="365" y="233" width="57" height="27" rx="2" fill="#9ab9ab"/><rect x="447" y="236" width="59" height="24" rx="2" fill="#c4cfb1"/><rect x="252" y="290" width="50" height="35" rx="2" fill="#b5c8b9"/><rect x="326" y="298" width="39" height="27" rx="2" fill="#edc9a8"/><rect x="390" y="294" width="52" height="31" rx="2" fill="#9ab9ab"/><rect x="462" y="296" width="48" height="29" rx="2" fill="#c4cfb1"/><text x="242" y="453" fill="#687d73" font-size="13" font-weight="400">Illustrated sample evidence</text><text x="224" y="492" fill="#687d73" font-size="13" font-weight="600">Check criterion</text><text x="224" y="519" fill="#193f35" font-size="14" font-weight="400">Display is tidy and shelf labels</text><text x="224" y="543" fill="#193f35" font-size="14" font-weight="400">are visible in the submitted image.</text><rect x="594" y="156" width="378" height="453" rx="10" fill="#fff" stroke="#dce5df"/><text x="616" y="190" fill="#193f35" font-size="18" font-weight="700">Verification outcome</text><rect x="616" y="216" width="166.5" height="28" rx="14" fill="#fff0d7"/><text x="628" y="235" fill="#845b16" font-size="12" font-weight="600">Human review needed</text><text x="616" y="280" fill="#193f35" font-size="16" font-weight="400">Some shelf labels are obscured.</text><text x="616" y="304" fill="#193f35" font-size="16" font-weight="400">The evidence does not support</text><text x="616" y="328" fill="#193f35" font-size="16" font-weight="400">a confident decision.</text><text x="616" y="380" fill="#687d73" font-size="13" font-weight="700">Review route</text><rect x="614" y="402" width="335" height="59" rx="10" fill="#eaf4e9"/><text x="630" y="437" fill="#193f35" font-size="16" font-weight="600">Assign to reviewer →</text><text x="616" y="501" fill="#687d73" font-size="14" font-weight="400">Processing error? Retry the check.</text><text x="616" y="525" fill="#687d73" font-size="14" font-weight="400">Unclear evidence? Keep human review.</text></g></svg>